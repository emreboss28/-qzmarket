<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mein Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
}
header {
  padding: 20px;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
}
.logo {
  font-size: 22px;
  font-weight: bold;
  color: #00ff88;
}
nav a {
  margin-left: 20px;
  color: #ccc;
  text-decoration: none;
}
.hero {
  padding: 60px 20px;
  text-align: center;
  background: linear-gradient(135deg, #00ff88, #0077ff);
  color: black;
}
.hero h1 {
  font-size: 40px;
  margin-bottom: 10px;
}
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}
.product {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #222;
  transition: 0.2s;
}
.product:hover {
  transform: translateY(-4px);
  border-color: #00ff88;
}
.product img {
  width: 100%;
  border-radius: 10px;
}
.product h3 {
  margin: 10px 0 5px;
}
.price {
  color: #00ff88;
  font-size: 20px;
  margin-bottom: 10px;
}
.buy-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background: #00ff88;
  color: black;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
}
.buy-btn:hover {
  background: #00cc66;
}
footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  border-top: 1px solid #222;
  color: #777;
}
</style>
</head>
<body>

<header>
  <div class="logo">MEIN SHOP</div>
  <nav>
    <a href="#products">Produkte</a>
    <a href="#kontakt">Kontakt</a>
  </nav>
</header>

<section class="hero">
  <h1>Willkommen in meinem Shop</h1>
  <p>Digitale Produkte, Tools, Services – alles an einem Ort.</p>
</section>

<div class="container" id="products">
  <h2>Produkte</h2>
  <div class="products">

    <!-- Produkt 1 -->
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Produkt">
      <h3>Premium Tool</h3>
      <p class="price">19.99€</p>
      <a class="buy-btn" href="https://dein-link-hier" target="_blank">Jetzt kaufen</a>
    </div>

    <!-- Produkt 2 -->
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Produkt">
      <h3>VIP Zugang</h3>
      <p class="price">9.99€</p>
      <a class="buy-btn" href="https://dein-link-hier" target="_blank">Jetzt kaufen</a>
    </div>

    <!-- Produkt 3 -->
    <div class="product">
      <img src="https://via.placeholder.com/300x200" alt="Produkt">
      <h3>Script / Bot</h3>
      <p class="price">14.99€</p>
      <a class="buy-btn" href="https://dein-link-hier" target="_blank">Jetzt kaufen</a>
    </div>

  </div>
</div>

<footer id="kontakt">
  <p>Kontakt: deinname@deinshop.de</p>
  <p>© 2024 Mein Shop</p>
</footer>

</body>
</html>
