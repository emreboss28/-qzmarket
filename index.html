<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QZMarket</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#0a0a0a;
color:white;
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
border-bottom:1px solid #222;
}
.logo{
font-size:32px;
font-weight:bold;
color:#8a2be2;
}
nav ul{
display:flex;
gap:30px;
list-style:none;
}
nav a{
color:white;
text-decoration:none;
}
.hero{
text-align:center;
padding:120px 20px;
}
.hero h1{
font-size:70px;
margin-bottom:20px;
}
.hero p{
font-size:22px;
color:#aaa;
margin-bottom:35px;
}
.discord-btn{
background:#8a2be2;
color:white;
padding:15px 35px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
display:inline-block;
}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:80px 10%;
}
.card{
background:#111;
border:1px solid #2b2b2b;
border-radius:20px;
padding:30px;
text-align:center;
transition:.3s;
}
.card:hover{
transform:translateY(-8px);
border-color:#8a2be2;
box-shadow:0 0 25px rgba(138,43,226,.5);
}
.card h3{
font-size:24px;
margin-bottom:20px;
}
.card button{
background:#8a2be2;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
}
footer{
text-align:center;
padding:40px;
color:#777;
border-top:1px solid #222;
}
</style>
</head>
<body>
<nav>
<div class="logo">QZMarket</div>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#shop">Shop</a></li>
<li><a href="https://discord.gg/7NKvmxuYHt">Support</a></li>
</ul>
</nav>
<section class="hero">
<h1>QZMarket</h1>
<p>Digital Marketplace</p>
<a class="discord-btn" href="https://discord.gg/7NKvmxuYHt">
Join Discord
</a>
</section>
<section id="shop" class="products">
<div class="card">
<h3>Category 1</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 2</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 3</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 4</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 5</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 6</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 7</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 8</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 9</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 10</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 11</h3>
<button>View</button>
</div>
<div class="card">
<h3>Category 12</h3>
<button>View</button>
</div>
</section>
<footer>
© 2025 QZMarket
</footer>
</body>
</html>
