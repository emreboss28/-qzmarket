<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QZMarket</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#0b0b0f;
color:white;
}
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#111;
border-bottom:1px solid #222;
}
.logo{
font-size:30px;
font-weight:bold;
color:#a855f7;
}
nav a{
color:white;
text-decoration:none;
margin-left:25px;
}
.hero{
min-height:80vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
background:linear-gradient(135deg,#12051f,#0b0b0f);
}
.hero-content h1{
font-size:70px;
margin-bottom:15px;
}
.hero-content span{
color:#a855f7;
}
.hero-content p{
font-size:22px;
color:#aaa;
max-width:700px;
margin:auto;
margin-bottom:30px;
}
.btn{
display:inline-block;
padding:15px 35px;
background:#8a2be2;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;
}
.categories{
padding:80px 8%;
}
.categories h2{
text-align:center;
font-size:45px;
margin-bottom:40px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}
.card{
background:#161616;
padding:30px;
border-radius:15px;
border:1px solid #2a2a2a;
cursor:pointer;
transition:.3s;
text-align:center;
}
.card:hover{
transform:translateY(-5px);
border-color:#8a2be2;
}
.card h3{
color:#a855f7;
}
#productBox{
display:none;
margin:50px 8%;
background:#111;
padding:30px;
border-radius:15px;
border:1px solid #8a2be2;
}
footer{
text-align:center;
padding:30px;
color:#777;
margin-top:50px;
}
</style>
<script>
function openCategory(name){
let box=document.getElementById("productBox");
box.style.display="block";
box.innerHTML=`
<h2>${name}</h2>
<br>
<p>Produktinformationen hier eintragen.</p>
<br>
<p>Preis: Hier Preis eintragen</p>
<br>
<a href="https://discord.gg/7NKvmxuYHt" target="_blank"
style="color:#a855f7;">
Discord Support öffnen
</a>
`;
window.scrollTo({
top:box.offsetTop-100,
behavior:"smooth"
});
}
</script>
</head>
<body>
<header>
<div class="logo">QZMarket</div>
<nav>
<a href="#">Home</a>
<a href="#categories">Products</a>
<a href="https://discord.gg/7NKvmxuYHt" target="_blank">Support</a>
</nav>
</header>
<section class="hero">
<div class="hero-content">
<h1>QZ<span>Market</span></h1>
<p>Premium Digital Marketplace & Community</p>
<a class="btn" href="#categories">Shop Now</a>
</div>
</section>
<section class="categories" id="categories">
<h2>Categories</h2>
<div class="grid">
<div class="card" onclick="openCategory('FiveM Scripts')">
<h3>FiveM Scripts</h3>
</div>
<div class="card" onclick="openCategory('Discord Bots')">
<h3>Discord Bots</h3>
</div>
<div class="card" onclick="openCategory('Graphics')">
<h3>Graphics</h3>
</div>
<div class="card" onclick="openCategory('Templates')">
<h3>Templates</h3>
</div>
<div class="card" onclick="openCategory('Tools')">
<h3>Tools</h3>
</div>
<div class="card" onclick="openCategory('Game Assets')">
<h3>Game Assets</h3>
</div>
</div>
</section>
<div id="productBox"></div>
<footer>
© 2025 QZMarket
</footer>
</body>
</html>
