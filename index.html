<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QZMarket</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#050505;
color:white;
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 10%;
border-bottom:1px solid #222;
}
.logo{
font-size:32px;
font-weight:bold;
color:#8a2be2;
}
nav a{
color:white;
text-decoration:none;
margin-left:20px;
}
.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}
.hero h1{
font-size:70px;
margin-bottom:15px;
}
.hero p{
font-size:22px;
color:#aaa;
max-width:700px;
margin-bottom:30px;
}
.btn{
background:#8a2be2;
color:white;
padding:15px 35px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
}
.features{
padding:80px 10%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}
.card{
background:#111;
padding:30px;
border-radius:20px;
border:1px solid #222;
}
.card h3{
color:#8a2be2;
margin-bottom:10px;
}
footer{
text-align:center;
padding:40px;
color:#666;
}
</style>
</head>
<body>
<nav>
<div class="logo">QZMarket</div>
<div>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Support</a>
</div>
</nav>
<section class="hero">
<h1>QZMarket</h1>
<p>The next generation marketplace for digital products.</p>
<a href="#" class="btn">Get Started</a>
</section>
<section class="features">
<div class="card">
<h3>Fast Trading</h3>
<p>Buy and sell instantly.</p>
</div>
<div class="card">
<h3>Secure</h3>
<p>Protected transactions and trusted sellers.</p>
</div>
<div class="card">
<h3>24/7 Access</h3>
<p>Trade whenever you want.</p>
</div>
</section>
<footer>
© 2025 QZMarket
</footer>
</body>
</html>
